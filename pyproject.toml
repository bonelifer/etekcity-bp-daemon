[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etekcity-bp-daemon"
version = "0.1.0"
description = "Standalone Linux daemon that logs Etekcity blood pressure monitor readings"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.11"
dependencies = [
    "etekcity-bp-ble @ git+https://github.com/bonelifer/etekcity-bp-ble.git",
    "aiomqtt>=2.0.0,<3.0.0",
    "apprise>=1.0.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "reportlab>=4.0.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/bonelifer/etekcity-bp-daemon"

[project.scripts]
etekcity-bp-daemon = "etekcity_bp_daemon.cli:main"
etekcity-bp-report = "etekcity_bp_daemon.report:main"
etekcity-bp-prune = "etekcity_bp_daemon.prune:main"
etekcity-bp-alert-check = "etekcity_bp_daemon.alerting:main"
etekcity-bp-api = "etekcity_bp_daemon.api:main"

[project.optional-dependencies]
dev = [
    "flake8>=7.0.0",
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etekcity_bp_daemon"]

[tool.hatch.metadata]
allow-direct-references = true
